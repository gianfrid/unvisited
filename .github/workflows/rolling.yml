# Rolling release: builds a signed release APK and a Linux x86_64 AppImage
# on every push to `slop` (or manual dispatch) and attaches both to the
# moving `rolling` GitHub release, where Obtanium picks up the APK
# (repo gianfrid/unvisited, assets unvisited-rolling-arm64.apk and
# unvisited-rolling-x86_64.AppImage). Each publish also stamps the release's
# name and body with the build's date, build number and the commit
# messages since the previous published build — GitHub keeps a moving
# release's original publish date, so the date rides in the title
# instead; the body's final "Commit:" line is the range anchor the next
# build reads its commit list from.
#
# Signing: the release keystore is a repo secret, passed via env vars —
# see android/app/build.gradle.kts. Set these secrets in the repo settings:
#   UNVISITED_KEYSTORE_B64      base64 of the .jks keystore
#   UNVISITED_KEYSTORE_PASSWORD keystore password
#   UNVISITED_KEY_ALIAS         key alias
#   UNVISITED_KEY_PASSWORD      key password
#
# The rolling label rides in the version name; the version code is the
# workflow run number, which increases monotonically so every build is
# seen as an update.
name: Rolling release APK

on:
  push:
    branches: [slop]
  workflow_dispatch:

permissions:
  contents: write # create/update the rolling release

concurrency:
  group: rolling
  cancel-in-progress: true

jobs:
  build:
    # Pinned image: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Resolve the build's commit date
        run: echo "COMMIT_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"

      - name: Collect the commits since the last published build
        run: |
          # The rolling tag does not move (the release is updated in place,
          # the tag stays at its first publish), so the previous build's
          # commit is taken from the release body's "Commit:" line instead
          # of the tag. Unknown anchor (first dated build, rewritten
          # history) collapses the range to HEAD: the body still names the
          # current commit.
          previous=$(gh api "repos/${{ github.repository }}/releases/tags/rolling" \
            --jq '.body' 2>/dev/null | sed -n 's/^Commit: \([0-9a-f]\{40\}\)$/\1/p' | head -1)
          if git cat-file -e "$previous" 2>/dev/null; then
            range="$previous..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "COMMITS<<EOF"
            git log --format='- %s (%h)' "$range"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Decode and verify the release keystore secret
        env:
          UNVISITED_KEYSTORE_B64: ${{ secrets.UNVISITED_KEYSTORE_B64 }}
          UNVISITED_KEYSTORE_PASSWORD: ${{ secrets.UNVISITED_KEYSTORE_PASSWORD }}
          UNVISITED_KEY_ALIAS: ${{ secrets.UNVISITED_KEY_ALIAS }}
          UNVISITED_KEY_PASSWORD: ${{ secrets.UNVISITED_KEY_PASSWORD }}
        run: |
          echo "$UNVISITED_KEYSTORE_B64" | base64 -d > /tmp/ks.bin
          echo "magic bytes:"; head -c 4 /tmp/ks.bin | xxd
          file /tmp/ks.bin
          for v in UNVISITED_KEYSTORE_PASSWORD UNVISITED_KEY_ALIAS UNVISITED_KEY_PASSWORD; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: EMPTY"; fi
          done
          keytool -list -v -keystore /tmp/ks.bin -storepass "$UNVISITED_KEYSTORE_PASSWORD" 2>&1 | head -8

      - name: Build release APK (rolling)
        env:
          UNVISITED_KEYSTORE_B64: ${{ secrets.UNVISITED_KEYSTORE_B64 }}
          UNVISITED_KEYSTORE_PASSWORD: ${{ secrets.UNVISITED_KEYSTORE_PASSWORD }}
          UNVISITED_KEY_ALIAS: ${{ secrets.UNVISITED_KEY_ALIAS }}
          UNVISITED_KEY_PASSWORD: ${{ secrets.UNVISITED_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform=android-arm64 \
            --build-name "1.0.0-rolling" --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-arm64-*-release.apk unvisited-rolling-arm64.apk

      - name: Linux desktop build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build AppImage (rolling)
        run: tool/build_appimage.sh --build-name "1.0.0-rolling" --build-number "${{ github.run_number }}"

      - name: Publish to the moving rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: Rolling — ${{ env.COMMIT_DATE }}
          body: |
            Build ${{ github.run_number }} — ${{ env.COMMIT_DATE }}

            What's new since the previous build:
            ${{ env.COMMITS }}

            Commit: ${{ github.sha }}
          make_latest: true
          files: |
            unvisited-rolling-arm64.apk
            unvisited-rolling-x86_64.AppImage
