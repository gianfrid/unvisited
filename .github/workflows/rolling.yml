# Rolling release APK: builds a signed release APK on every push to `slop`
# (or manual dispatch) and attaches it to the moving `rolling` GitHub
# release, where Obtanium picks it up (repo gianfrid/unvisited, asset
# unvisited-rolling-arm64.apk).
#
# Signing: the release keystore is a repo secret, passed via env vars —
# see android/app/build.gradle.kts. Set these secrets in the repo settings:
#   UNVISITED_KEYSTORE_B64      base64 of the .jks keystore
#   UNVISITED_KEYSTORE_PASSWORD keystore password
#   UNVISITED_KEY_ALIAS         key alias
#   UNVISITED_KEY_PASSWORD      key password
#
# The rolling label rides in the version name; the version code is the
# workflow run number, which increases monotonically so every build is
# seen as an update.
name: Rolling release APK

on:
  push:
    branches: [slop]
  workflow_dispatch:

permissions:
  contents: write # create/update the rolling release

concurrency:
  group: rolling
  cancel-in-progress: true

jobs:
  build:
    # Pinned image: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Decode and verify the release keystore secret
        env:
          UNVISITED_KEYSTORE_B64: ${{ secrets.UNVISITED_KEYSTORE_B64 }}
          UNVISITED_KEYSTORE_PASSWORD: ${{ secrets.UNVISITED_KEYSTORE_PASSWORD }}
          UNVISITED_KEY_ALIAS: ${{ secrets.UNVISITED_KEY_ALIAS }}
          UNVISITED_KEY_PASSWORD: ${{ secrets.UNVISITED_KEY_PASSWORD }}
        run: |
          echo "$UNVISITED_KEYSTORE_B64" | base64 -d > /tmp/ks.bin
          echo "magic bytes:"; head -c 4 /tmp/ks.bin | xxd
          file /tmp/ks.bin
          for v in UNVISITED_KEYSTORE_PASSWORD UNVISITED_KEY_ALIAS UNVISITED_KEY_PASSWORD; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: EMPTY"; fi
          done
          keytool -list -v -keystore /tmp/ks.bin -storepass "$UNVISITED_KEYSTORE_PASSWORD" 2>&1 | head -8

      - name: Build release APK (rolling)
        env:
          UNVISITED_KEYSTORE_B64: ${{ secrets.UNVISITED_KEYSTORE_B64 }}
          UNVISITED_KEYSTORE_PASSWORD: ${{ secrets.UNVISITED_KEYSTORE_PASSWORD }}
          UNVISITED_KEY_ALIAS: ${{ secrets.UNVISITED_KEY_ALIAS }}
          UNVISITED_KEY_PASSWORD: ${{ secrets.UNVISITED_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform=android-arm64 \
            --build-name "1.0.0-rolling" --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-arm64-*-release.apk unvisited-rolling-arm64.apk

      - name: Publish to the moving rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: Rolling
          make_latest: true
          files: unvisited-rolling-arm64.apk
