name: unvisited
description: GPS track import and exploration app — OpenTracks FIT/GPX/KMZ/TCX
  files on one fog-of-war OSM map.
publish_to: 'none'
repository: https://github.com/gianfrid/unvisited

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  file_picker: ^13.3.3
  xml: ^7.1.0
  archive: ^4.6.0
  geolocator: ^14.1.2
  flutter_compass: ^0.8.1
  url_launcher: ^6.3.1
  image_picker: ^1.2.4

  cupertino_ui: any
  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
